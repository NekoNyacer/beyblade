<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#0a0e17"><title>拉環手感測試｜CathayBlade</title>
  <link rel="icon" href="/assets/broadcast-tree.svg" type="image/svg+xml"><link rel="stylesheet" href="/assets/play.css"><link rel="stylesheet" href="/assets/pull-test.css"><link rel="stylesheet" href="/assets/launch-screen.css"><link rel="stylesheet" href="/assets/flexible-ripcord.css"><link rel="stylesheet" href="/assets/launcher.css">  <link rel="stylesheet" href="/assets/broadcast-kit.css">
  <link rel="stylesheet" href="/assets/lab-broadcast.css">
</head>
<body class="feel-page lab-page pull-lab"><div id="rotate-phone" class="rotate-phone" role="status"><p>請將裝置轉為橫向</p></div><div class="lab-shell broadcast-shell">
  <header class="lab-mast">
    <a class="lab-brand-link" href="/" aria-label="CathayBlade 主持控制台"><span class="broadcast-brand"><img src="/assets/cathayblade.svg" alt="CathayBlade"></span></a>
    <h1>拉環手感測試</h1>
    <nav aria-label="測試導覽"><a href="#phone-share">手機掃碼加入</a><a href="/launch-test">雙機實戰</a><a class="lab-back" href="/#settings"><svg class="lab-icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5m7-7-7 7 7 7"/></svg>主持設定</a></nav>
  </header>
  <main>

<section class="feel-arena" aria-label="拉環發射的即時三維戰鬥場"><div id="feel-arena"></div><div class="arena-caption"><div class="speed-plate"><span class="speed-title"><b>P1</b>你的拉環</span><div class="speed-value"><strong id="pull-live-rpm">—</strong> <small>RPM</small></div></div><div class="speed-plate"><span class="speed-title"><b>P2</b>標準對手</span><div class="speed-value"><strong id="reference-live-rpm">—</strong> <small>RPM</small></div></div></div><output id="attempt">尚未發射</output></section>
<section class="feel-controls broadcast-panel" aria-label="拉環控制"><div class="pull-heading"><h2>握住拉環，向右抽到底</h2><button id="reset-pull" type="button" class="secondary">清空戰鬥場</button></div><p class="pull-hint">慢拉、快拉、向右上或右下斜拉，直接比較入場軌跡。</p><div class="mechanism">        <div id="ripcord" class="ripcord ripcord-horizontal active">

          <div class="pull-track" aria-hidden="true"><svg viewBox="0 0 240 100" preserveAspectRatio="none"><path d="m36 18 32 32-32 32m60-64 32 32-32 32m60-64 32 32-32 32"/></svg></div>
          <div class="launcher-top" aria-hidden="true"><div id="loaded-top"></div></div>
          <img class="launcher-body" data-part="body" src="/assets/launcher-body.svg" alt="" draggable="false">
          <div class="cord-assembly">
            <img class="cord-strip" data-part="rack" src="/assets/launcher-rack.svg" alt="" draggable="false">
            <button id="handle" type="button" aria-label="握住拉環向右抽到底；鍵盤按 Enter 或空白鍵發射" aria-disabled="false">
              <img data-part="loop" src="/assets/launcher-loop.svg" alt="" draggable="false">
            </button>
          </div>
        </div>
</div><p id="feel-status" role="status">請用手機掃碼拉環；主畫面會即時顯示入場。</p><div class="readings" aria-label="最近一次拉環數據"><div><span>拉速</span><output id="speed">—</output></div><div><span>手勢角度</span><output id="angle">—</output></div><div><span>入場初速</span><output id="velocity">—</output></div><div><span>初始轉速</span><output id="rpm">—</output></div></div><p id="feel-error" role="alert"></p><p class="practice-note">獨立練習，不影響正式比賽。固定場地、組裝與起點，僅依這次手勢改變紅色陀螺。鍵盤 Enter／空白鍵可標準發射。</p></section>
<details id="phone-share" class="phone-share broadcast-panel" open><summary>手機掃碼，主畫面觀看</summary><p>手機和電腦連到同一個 Wi-Fi，再掃碼。手機維持標準拉環介面，陀螺入場與轉動只在這個主畫面顯示。</p><p id="feel-connection" role="status">正在建立手機連線…</p><label for="feel-network">連線網址</label><select id="feel-network"></select><img hidden id="feel-qr" alt="手機開啟拉環手感測試" width="160" height="160"><a id="feel-link"></a></details>
</main>
  </div><script type="module" src="/assets/pull-test.js"></script></body></html>
