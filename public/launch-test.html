<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>手機實戰測試｜戰鬥陀螺</title><link rel="stylesheet" href="/assets/main.css"><link rel="stylesheet" href="/assets/launch-test.css"></head><body class="launch-test-page"><main><header><div><h1>手機拉環，真實開戰。</h1><p>一支手機就能測試，系統會加入一位標準力道的對手。</p></div><nav><a href="/pull-test">開啟無限拉環手感測試</a> · <a href="/scenarios">示範情境</a></nav></header><div class="launch-layout"><aside><h2>手機掃碼加入</h2><img hidden id="lab-qr" width="220" height="220" alt="用手機掃描，加入拉環測試"><label for="lab-network">手機可連線的網址</label><select id="lab-network"></select><a id="lab-join" target="_blank" rel="noopener"></a><p class="join-help">手機與電腦連到同一個 Wi-Fi／路由器。<br>加入並確認組裝後，握住拉環。</p><div id="lab-players" aria-live="polite"></div><button id="lab-start" class="primary" disabled>等待手機加入</button><p id="lab-status" role="status">正在建立本機測試…</p><button id="lab-new">建立新的測試房間</button><p id="lab-error" role="alert"></p></aside><section class="live-battle" aria-label="即時戰鬥畫面"><iframe id="lab-display" title="手機發射的即時戰鬥" allow="fullscreen"></iframe><div class="battle-help"><p><strong>先慢拉，再猛拉</strong>比較起轉速度、搭齒與撞罩耗損。</p><p><strong>試試平拉與斜拉</strong>往右抽出；手勢角度會微調發射方向。</p><button id="lab-sound">開啟戰鬥音效</button></div></section></div></main><script type="module" src="/assets/launch-test.js"></script></body></html>
