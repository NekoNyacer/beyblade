<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0b1019">
  <title>拉環測試控制器｜CathayBlade</title>
  <link rel="icon" href="/assets/broadcast-tree.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/play.css">
  <link rel="stylesheet" href="/assets/launch-screen.css">
  <link rel="stylesheet" href="/assets/flexible-ripcord.css">
  <link rel="stylesheet" href="/assets/launcher.css">
  <link rel="stylesheet" href="/assets/broadcast-kit.css">
  <link rel="stylesheet" href="/assets/handset-broadcast.css">
  <script type="module" src="/assets/pull-phone.js"></script>
</head>
<body class="launch-mode handset-page">
  <div id="rotate-phone" class="rotate-phone" role="status"><p>請將裝置轉為橫向</p></div>
  <main class="broadcast-shell">
    <section id="player-panel" aria-label="拉環測試控制器">
      <div id="launcher-screen">
        <h1 id="phase-title" class="sr-only">握住拉環，向右抽出</h1>
        <div class="launch-heading"><strong class="title-ribbon"><span>拉環測試</span><i>LAUNCH</i></strong><span class="broadcast-brand"><img src="/assets/cathayblade.svg" alt="CathayBlade"></span></div>
        <output id="launch-cue" aria-live="polite" aria-atomic="true"></output>
        <div id="ripcord" class="ripcord ripcord-horizontal">
          <div class="launch-orbit" aria-hidden="true"></div>
          <div class="pull-track" aria-hidden="true"><svg viewBox="0 0 240 100" preserveAspectRatio="none"><path d="m36 18 32 32-32 32m60-64 32 32-32 32m60-64 32 32-32 32"/></svg></div>
          <div class="launcher-top" aria-hidden="true"><div id="loaded-top"></div></div>
          <img class="launcher-body" data-part="body" src="/assets/launcher-body.svg" alt="" draggable="false">
          <div class="cord-assembly">
            <img class="cord-strip" data-part="rack" src="/assets/launcher-rack.svg" alt="" draggable="false">
            <button id="handle" type="button" aria-label="握住拉環向右抽到底；鍵盤按 Enter 或空白鍵發射" aria-disabled="true">
              <img data-part="loop" src="/assets/launcher-loop.svg" alt="" draggable="false">
            </button>
          </div>
        </div>
        <div class="launch-instruction"><strong id="launch-readiness"><span id="launch-readiness-label">待機</span><b id="launch-readiness-code">READY</b></strong><small id="launch-help">連線後可無限次試拉</small></div>
        <p id="launch-status" class="sr-only" role="status"></p>
      </div>
      <p id="player-error" class="error" role="alert"></p>
    </section>
  </main>
  <div class="gate-brand"><span class="broadcast-brand"><img src="/assets/cathayblade.svg" alt="CathayBlade"></span></div>
</body>
</html>
