<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>CathayBlade｜觀眾投影</title>
  <link rel="icon" href="/assets/broadcast-tree.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/main.css">
  <link rel="stylesheet" href="/assets/bracket.css">
  <link rel="stylesheet" href="/assets/display-redesign.css">
  <link rel="stylesheet" href="/assets/broadcast-kit.css">
  <link rel="stylesheet" href="/assets/champion-result.css">
</head>
<body class="display-page">
  <main class="projection-screen" aria-label="現場投影">
    <div id="arena" class="display-arena"></div>
    <header class="display-header">
      <div class="projection-title">
        <h1 id="match-title">對戰轉播</h1>
        <p id="mode-label"></p>
      </div>
      <div class="display-state">
        <strong id="air-label">MATCH</strong>
        <span id="connection" class="connection">連線中</span>
      </div>
    </header>
    <aside id="invite" class="display-invite" hidden>
      <h2>掃碼加入戰局</h2>
      <img id="qr" alt="手機加入 QR Code" width="220" height="220">
      <strong id="room-code"></strong>
      <p>手機與主機連同一個 Wi-Fi</p><span id="join-short"></span>
    </aside>
    <aside id="roster" class="display-roster" aria-label="選手與轉速"></aside>
    <div id="center-message" class="center-message" aria-live="polite"></div>
    <section id="versus" class="versus" aria-label="本場對戰組合" hidden></section>
    <section id="result" class="display-result" aria-label="比賽結果" aria-live="polite" hidden></section>
    <section id="display-schedule" class="display-schedule" aria-labelledby="display-schedule-title" hidden>
      <h2 id="display-schedule-title">淘汰賽晉級圖</h2><div id="display-bracket"></div>
    </section>
    <footer class="display-footer">
      <span class="broadcast-brand"><img src="/assets/cathayblade.svg" alt="CathayBlade"></span>
      <p id="commentary"></p>
      <div class="projection-timing"><span id="phase-heading">連線中</span><span id="round-label"></span></div>
    </footer>
    <div class="display-tools"><button id="result-bracket-toggle" aria-controls="display-schedule" aria-expanded="false" hidden>查看完整賽程</button><button id="sound">開啟現場音效</button><button id="fullscreen">全螢幕</button></div>
    <p id="error" class="error" role="alert" hidden></p>
  </main>
  <script type="module" src="/assets/display.js"></script>
</body>
</html>
