<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0b1019">
  <title>選手控制器｜CathayBlade</title>
  <link rel="icon" href="/assets/broadcast-tree.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/play.css">
  <link rel="stylesheet" href="/assets/launch-screen.css">
  <link rel="stylesheet" href="/assets/flexible-ripcord.css">
  <link rel="stylesheet" href="/assets/launcher.css">
  <link rel="stylesheet" href="/assets/broadcast-kit.css">
  <link rel="stylesheet" href="/assets/handset-broadcast.css">
  <script type="module" src="/assets/play.js"></script>
</head>
<body class="handset-page">
  <main class="broadcast-shell">
    <header>
      <span class="broadcast-brand"><img src="/assets/cathayblade.svg" alt="CathayBlade"></span>
      <span id="connection" class="connection" role="status">尚未連線</span>
    </header>
    <section id="join-panel" aria-labelledby="join-title">
      <div class="join-hero">
        <h1 id="join-title" class="title-ribbon"><span>選手入場</span><small>PLAYER ENTRY</small></h1>
        <div class="hero-art" aria-hidden="true"><img id="join-top-art" src="/assets/art/top-000.png" alt="" fetchpriority="high" decoding="async"></div>
      </div>
      <form id="join-form">
        <label for="name">選手名稱</label>
        <input id="name" name="name" maxlength="16" autocomplete="nickname" required placeholder="輸入你的名字">
        <button id="join-button" class="primary broadcast-action" type="submit"><span id="join-button-label">加入對戰</span><svg class="button-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m8 5 7 7-7 7"/></svg></button>
      </form>
      <p id="join-error" class="error" role="alert"></p>
    </section>
    <section id="player-panel" hidden aria-label="選手控制">
      <section id="assembly" aria-labelledby="assembly-title">
        <div class="assembly-tools">
          <h1 id="assembly-title" class="title-ribbon"><span>組裝與發射</span><small>ASSEMBLY</small></h1>
          <button id="random-parts" class="secondary" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h3c4 0 7 12 11 12h4m-4-4 4 4-4 4M3 18h3c1.8 0 3.4-2.4 5-5M14 9c1-2 2-3 3-3h4m-4-4 4 4-4 4"/></svg>隨機組裝</button>
        </div>
        <div class="assembly-stage">
          <div id="part-rows"></div>
          <div class="assembly-finish">
            <div class="combination" aria-label="目前選擇的零件組合">
              <div class="mounted-preview" aria-hidden="true">
                <div id="combination-preview"></div>
                <img class="mounted-rack" src="/assets/launcher-rack.svg#amber" alt="">
                <img class="mounted-grip" src="/assets/launcher-loop.svg#amber" alt="">
                <img class="mounted-housing" src="/assets/launcher-body.svg#pearl" alt="">
              </div>
              <div class="combination-info"><h2>你的組合 <small>COMBINATION</small></h2><output id="combination-summary" aria-live="polite" aria-atomic="true"></output></div>
            </div>
            <button id="confirm-parts" class="primary broadcast-action" type="button"><span>確認組裝</span><svg class="button-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m3 12 6 6L21 6"/></svg></button>
            <p class="parts-note">遊戲內模擬效果，非實物測試數據</p>
          </div>
        </div>
        <p id="assembly-status" role="status"></p>
      </section>
      <div id="launcher-screen" hidden>
        <h1 id="phase-title" class="sr-only">握住拉環，向右抽出</h1>
        <div class="launch-heading"><strong class="title-ribbon"><span>準備發射</span><i>LAUNCH</i></strong><span class="broadcast-brand"><img src="/assets/cathayblade.svg" alt="CathayBlade"></span></div>
        <output id="launch-cue" aria-live="polite" aria-atomic="true"></output>
        <div id="ripcord" class="ripcord ripcord-horizontal">
          <div class="launch-orbit" aria-hidden="true"></div>
          <div class="pull-track" aria-hidden="true"><svg viewBox="0 0 240 100" preserveAspectRatio="none"><path d="m36 18 32 32-32 32m60-64 32 32-32 32m60-64 32 32-32 32"/></svg></div>
          <div class="launcher-top" aria-hidden="true"><div id="loaded-top"></div></div>
          <img class="launcher-body" data-part="body" src="/assets/launcher-body.svg" alt="" draggable="false">
          <div class="cord-assembly">
            <img class="cord-strip" data-part="rack" src="/assets/launcher-rack.svg" alt="" draggable="false">
            <button id="handle" type="button" aria-label="握住拉環向右抽到底；鍵盤按 Enter 或空白鍵發射" aria-disabled="true">
              <img data-part="loop" src="/assets/launcher-loop.svg" alt="" draggable="false">
            </button>
          </div>
        </div>
        <div class="launch-instruction"><strong id="launch-readiness"><span id="launch-readiness-label">待機</span><b id="launch-readiness-code">READY</b></strong><small id="launch-help">等待 SHOOT 出現後發射</small></div>
        <p id="launch-status" class="sr-only" role="status"></p>
      </div>
      <p id="player-error" class="error" role="alert"></p>
      <button id="retry" class="secondary" type="button" hidden>重新連線</button>
    </section>
    <footer><span id="room-label">現場連線</span></footer>
  </main>
  <div class="gate-brand"><span class="broadcast-brand"><img src="/assets/cathayblade.svg" alt="CathayBlade"></span></div>
</body>
</html>
