<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#101728">
  <title>選手拉環 · 旋風競技場</title>
  <link rel="stylesheet" href="/assets/play.css">
  <script type="module" src="/assets/play.js"></script>
</head>
<body>
  <main>
    <header><span class="wordmark">旋風競技場 <small>選手席</small></span><span id="connection" class="connection" role="status">尚未連線</span></header>
    <section id="join-panel" aria-labelledby="join-title">
      <p class="eyebrow">READY TO SPIN</p>
      <h1 id="join-title">你的回合，<br>一拉開戰。</h1>
      <p class="intro">加入後選擇零件、確認組裝。<br>等 SHOOT 亮起，握住拉環向右抽出。</p>
      <form id="join-form">
        <label for="name">大螢幕顯示名稱</label>
        <input id="name" name="name" maxlength="16" autocomplete="nickname" required placeholder="怎麼稱呼你？" aria-describedby="name-hint">
        <p id="name-hint" class="hint">最多 16 字，現場所有人都看得到。</p>
        <button id="join-button" class="primary" type="submit">加入競技場 <span aria-hidden="true">↗</span></button>
      </form>
      <p id="join-error" class="error" role="alert"></p>
    </section>
    <section id="player-panel" hidden aria-labelledby="phase-title">
      <section id="assembly"><h1>組裝你的陀螺</h1><button id="random-parts" class="secondary">隨機組裝</button><div id="part-rows"></div><button id="confirm-parts" class="primary">確定組裝零件</button><p id="assembly-status" role="status"></p></section>
      <div id="launcher-screen" hidden>
        <h1 id="phase-title" class="sr-only">握住拉環，向右抽出</h1>
        <output id="launch-cue" aria-live="polite" aria-atomic="true"></output>
        <div id="ripcord" class="ripcord">
          <div class="launcher-top" aria-hidden="true"><div id="loaded-top"></div></div>
          <div class="launcher-body" aria-hidden="true"><span></span></div>
          <div class="cord-assembly">
            <div class="cord-strip" aria-hidden="true"></div>
            <button id="handle" type="button" aria-label="握住拉環向右抽到底；鍵盤按 Enter 或空白鍵發射" aria-disabled="true">
              <svg viewBox="0 0 160 200" aria-hidden="true"><defs><linearGradient id="grip-metal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d9e3e9"/><stop offset=".2" stop-color="#718793"/><stop offset=".42" stop-color="#d6e2e7"/><stop offset=".7" stop-color="#536979"/><stop offset="1" stop-color="#c5d6df"/></linearGradient></defs><path fill="url(#grip-metal)" stroke="#9cb0bb" stroke-width="2" fill-rule="evenodd" d="M12 10H91Q98 10 102 17L153 91Q159 100 153 109L102 183Q98 190 91 190H12Q4 190 4 182V18Q4 10 12 10ZM32 37V163H79L123 100L79 37Z"/><path d="M32 37V163H79L123 100L79 37Z" fill="none" stroke="#55d882" stroke-width="4" stroke-linejoin="round"/></svg>
            </button>
          </div>
        </div>
        <p id="launch-status" class="sr-only" role="status"></p>
      </div>
      <p id="player-error" class="error" role="alert"></p>
      <button id="retry" class="secondary" type="button" hidden>重新連線</button>
    </section>
    <footer><span id="room-label">現場連線</span><span>請保持此頁開啟</span></footer>
  </main>
</body>
</html>
